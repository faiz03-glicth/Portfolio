# =============================================================================
# Nginx reverse proxy for the Next.js standalone server.
#
# Install on the VPS as /etc/nginx/sites-available/portfolio and symlink it
# into sites-enabled. Replace example.com with the real domain.
#
# What Nginx is doing here, and what it is not:
#   - It terminates TLS and proxies to the Node process on 127.0.0.1:3000.
#   - It serves Next's immutable build assets directly, so a hashed JS chunk
#     never wakes the Node process.
#   - It does NOT try to serve the application itself. Server Components, Route
#     Handlers and ISR all need the Node runtime; there is no static-only mode
#     that preserves them.
# =============================================================================

# Rate limit zone for the API surface. Declared at http scope — move this line
# into /etc/nginx/nginx.conf if this file is included inside an http block that
# already defines zones.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

upstream portfolio_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

# --- HTTP: redirect everything to HTTPS, except the ACME challenge ----------
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Certbot writes renewal challenges here; redirecting them breaks renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS -----------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling: lets clients verify the certificate without a round trip
    # to the CA.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    # HSTS. Only enable this once HTTPS is confirmed working — browsers cache
    # it, and a broken certificate afterwards locks visitors out for max-age.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The application sets X-Frame-Options, nosniff, Referrer-Policy and
    # Permissions-Policy itself (next.config.mjs). They are not duplicated here:
    # two sources for one header is how they end up contradicting each other.

    # Hide the version number from error pages and the Server header.
    server_tokens off;

    # Let the site serve its own pages; only the fallback is Nginx's.
    client_max_body_size 2m;

    # --- Immutable build assets --------------------------------------------
    # Content-hashed filenames, so they can be cached forever. Served straight
    # from disk — these requests never reach Node.
    location /_next/static/ {
        alias /var/www/portfolio/current/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Files from public/ -------------------------------------------------
    location /_next/image {
        # Next's optimiser is a runtime endpoint, not a static file — proxy it.
        proxy_pass http://portfolio_upstream;
        proxy_set_header Host $host;
        proxy_cache_valid 200 7d;
    }

    location = /favicon.svg {
        alias /var/www/portfolio/current/public/favicon.svg;
        access_log off;
        expires 7d;
    }

    location = /robots.txt {
        proxy_pass http://portfolio_upstream;
    }

    # --- API routes ---------------------------------------------------------
    # Rate limited: these are the only paths that reach an external provider,
    # so they are the only ones where a flood costs a third-party rate limit
    # rather than just CPU.
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://portfolio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # --- Everything else ----------------------------------------------------
    location / {
        proxy_pass http://portfolio_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Next reads this to build absolute URLs behind a proxy. Without it,
        # redirects and canonical links come out as http://.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_cache_bypass $http_upgrade;

        # A page that takes longer than this is broken, not slow.
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    access_log /var/log/nginx/portfolio.access.log;
    error_log  /var/log/nginx/portfolio.error.log warn;
}
